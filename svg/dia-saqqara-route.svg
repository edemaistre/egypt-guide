<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1210" role="img" aria-labelledby="dia-saqqara-route-t dia-saqqara-route-d">
<title id="dia-saqqara-route-t">Djoser's Step Pyramid complex</title><desc id="dia-saqqara-route-d">Plan sketch of Djoser's rectangular enclosure at Saqqara, north up, long side north-south (about 545 by 277 m). Visit order: 1 entrance colonnade in the south-east corner, 2 Great South Court, 3 Step Pyramid, 4 Heb-Sed court with dummy chapels on the east side, 5 serdab with Djoser's statue north-east of the pyramid, 6 South Tomb by the south wall. The wall has 15 gates, 14 false and one real. Inset: the Pyramid of Unas and its causeway to the south-west; the Imhotep Museum by the site entrance.</desc>
<text x="40.0" y="70.0" font-family="Fraunces, Georgia, serif" font-size="44" font-weight="600" fill="#1F2A37" text-anchor="start">Djoser's Step Pyramid complex</text>
