<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1304" role="img" aria-labelledby="dia-timeline-t dia-timeline-d">
<title id="dia-timeline-t">Who built what, and when</title><desc id="dia-timeline-d">Horizontal timeline from 2700 BC to AD 2026, linear scale with a break between AD 400 and 1900. Period bands: Old Kingdom c.2686-2181 BC, Middle Kingdom c.2055-1650 BC, New Kingdom c.1550-1069 BC, Ptolemaic 305-30 BC, Roman 30 BC-AD 395, then modern. Markers, each tagged with where the family sees it: Djoser c.2670 BC (Saqqara), Khufu c.2560 BC (Giza), Hatshepsut c.1479-1458 BC, Amenhotep III c.1390-1353 BC, Ramesses II c.1279-1213 BC and Ramesses III c.1184-1153 BC (all Luxor), Tutankhamun c.1332-1323 BC (GEM, Cairo), Edfu temple built 237-57 BC, Philae temples Ptolemaic and Roman with the last hieroglyphs AD 394 (Aswan), Tutankhamun's tomb found 1922, Philae moved in the 1970s, Grand Egyptian Museum opened 2025.</desc>
