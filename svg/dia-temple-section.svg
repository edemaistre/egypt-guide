<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1260" role="img" aria-labelledby="dia-temple-section-t dia-temple-section-d">
<title id="dia-temple-section-t">Into the temple, step by step</title><desc id="dia-temple-section-d">Long section through a typical Egyptian temple, using Edfu as the example, entrance on the left. From left: the pylon and gate; the open sun court under the sky; the first hall of columns; a second, smaller hall; the offering hall; the sanctuary with the god's shrine. The floor steps up and the ceiling steps down towards the sanctuary while the rooms get darker, shown by an arrow from sun and crowd to dark and god.</desc>
<text x="40.0" y="70.0" font-family="Fraunces, Georgia, serif" font-size="44" font-weight="600" fill="#1F2A37" text-anchor="start">Into the temple, step by step</text>
<text x="40.0" y="114.0" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="28" font-weight="400" fill="#8A8F98" text-anchor="start">Long section, Edfu as the example. Not to scale.</text>
