<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1392" role="img" aria-labelledby="dia-giza-khufu-section-t dia-giza-khufu-section-d">
<title id="dia-giza-khufu-section-t">Inside the Great Pyramid</title><desc id="dia-giza-khufu-section-d">Schematic north-south cross-section of the Great Pyramid of Khufu. The original entrance is on the north face about 17 m above the ground; the Descending Passage runs down into the bedrock to an unfinished underground chamber. The Ascending Passage branches up to the Grand Gallery, which leads to the King's Chamber; a horizontal passage leads to the Queen's Chamber. A dashed shape above the Grand Gallery marks the ScanPyramids Big Void, found in 2017, about 30 m long. Al-Mamun's tunnel, about AD 820, is the break-in route the public uses today. The interior visit is not part of the programme.</desc>
<text x="40.0" y="70.0" font-family="Fraunces, Georgia, serif" font-size="44" font-weight="600" fill="#1F2A37" text-anchor="start">Inside the Great Pyramid</text>
<text x="40.0" y="114.0" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="28" font-weight="400" fill="#8A8F98" text-anchor="start">Schematic cross-section, north to south. Not to scale.</text>
