<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1030" role="img" aria-labelledby="dia-kom-ombo-plan-t dia-kom-ombo-plan-d">
<title id="dia-kom-ombo-plan-t">Kom Ombo: one temple, two gods</title><desc id="dia-kom-ombo-plan-d">Plan of the double temple of Kom Ombo with north at the top and the Nile on the entrance side. A dashed centre line splits it: the north half belongs to Haroeris (Horus the Elder, falcon-headed, sky and war god), the south half to Sobek (crocodile god of water and fertility). Two entrances lead along two aisles through the halls to two sanctuaries at the back, inside shared outer walls: twin doors, twin halls, twin sanctuaries.</desc>
<text x="40.0" y="70.0" font-family="Fraunces, Georgia, serif" font-size="44" font-weight="600" fill="#1F2A37" text-anchor="start">Kom Ombo: one temple, two gods</text>
