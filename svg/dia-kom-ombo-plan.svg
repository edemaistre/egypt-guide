<text x="150.0" y="232.0" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="28" font-weight="400" fill="#1F2A37" text-anchor="start">Horus the Elder, falcon-headed</text>
<text x="150.0" y="266.0" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="28" font-weight="400" fill="#1F2A37" text-anchor="start">god of the sky and of war</text>
<text x="150.0" y="768.0" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="32" font-weight="700" fill="#5C7F4D" text-anchor="start">SOUTH half: Sobek</text>
