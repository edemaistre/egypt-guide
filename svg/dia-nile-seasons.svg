<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1345" role="img" aria-labelledby="dia-nile-seasons-t dia-nile-seasons-d">
<title id="dia-nile-seasons-t">The three seasons of the Nile</title><desc id="dia-nile-seasons-d">Circular calendar of the three ancient Egyptian seasons around a month ring: Akhet, the flood, about July to November, when the river covered the fields and left black mud; Peret, the growing season, about November to March, when farmers sowed and crops grew; Shemu, the harvest, about March to July, when crops were cut and the river was lowest. A note says the Aswan High Dam (1970) ended the yearly flood.</desc>
<text x="40.0" y="70.0" font-family="Fraunces, Georgia, serif" font-size="44" font-weight="600" fill="#1F2A37" text-anchor="start">The three seasons of the Nile</text>
<text x="40.0" y="114.0" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="28" font-weight="400" fill="#8A8F98" text-anchor="start">The ancient Egyptian farming year.</text>
