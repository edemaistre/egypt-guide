<text x="70.0" y="1113.0" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="28" font-weight="400" fill="#1F2A37" text-anchor="start">The water goes down; farmers sow and the crops grow.</text>
<rect x="40.0" y="1149.0" width="14.0" height="72.0" rx="4" fill="#C79A3B" stroke="none" stroke-width="0"/>
<text x="70.0" y="1175.0" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="30" text-anchor="start" xml:space="preserve"><tspan font-weight="700" fill="#1F2A37">Shemu, harvest</tspan><tspan font-weight="400" fill="#1F2A37"> (about March to July)</tspan></text>
<text x="70.0" y="1213.0" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="28" font-weight="400" fill="#1F2A37" text-anchor="start">Crops are cut and the river is at its lowest.</text>
<rect x="40.0" y="1255.0" width="920.0" height="64.0" rx="12" fill="#EFE4CC" stroke="#2F6F8F" stroke-width="3"/>
<text x="500.0" y="1297.0" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="28" font-weight="700" fill="#1F2A37" text-anchor="middle">The Aswan High Dam (1970) ended the yearly flood.</text>
</svg>
