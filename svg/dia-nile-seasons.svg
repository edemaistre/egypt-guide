<text x="70.0" y="1013.0" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="28" font-weight="400" fill="#1F2A37" text-anchor="start">The river covers the fields and leaves rich black mud.</text>
<rect x="40.0" y="1049.0" width="14.0" height="72.0" rx="4" fill="#5C7F4D" stroke="none" stroke-width="0"/>
