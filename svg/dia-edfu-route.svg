<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1382" role="img" aria-labelledby="dia-edfu-route-t dia-edfu-route-d">
<title id="dia-edfu-route-t">Edfu temple: the visit in 8 stops</title><desc id="dia-edfu-route-d">Plan of Edfu temple with the entrance at the bottom and the sanctuary at the top, eight numbered stops: 1 granite falcon statues of Horus at the gate, 2 the pylon with the king smiting enemies, 3 the open court with its colonnade, 4 the first hall of columns, 5 the second hall, 6 the offering hall, 7 the sanctuary with the granite shrine, 8 the corridor that runs all round the temple core inside the enclosure wall, with reliefs of Horus against Set. A note says to ask the guide about the calèche drop-off and ticket gate.</desc>
<text x="40.0" y="70.0" font-family="Fraunces, Georgia, serif" font-size="44" font-weight="600" fill="#1F2A37" text-anchor="start">Edfu temple: the visit in 8 stops</text>
