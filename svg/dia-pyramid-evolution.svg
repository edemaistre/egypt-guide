<text x="40.0" y="1046.0" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="28" font-weight="400" fill="#8A8F98" text-anchor="start">Heights are original and approximate. All dates c. BC.</text>
</svg>
