<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1182" role="img" aria-labelledby="dia-hatshepsut-t dia-hatshepsut-d">
<title id="dia-hatshepsut-t">Hatshepsut's temple: three terraces</title><desc id="dia-hatshepsut-d">Front elevation of Hatshepsut's temple at Deir el-Bahari against the curved cliff, seen looking west, so south is on the left and north on the right. Three terraces climb towards the cliff, joined by a central ramp. The lower terrace has colonnades with Osiride statues. On the middle terrace, the south end holds the Punt colonnade and the Chapel of Hathor, the north end the Birth colonnade and the Chapel of Anubis. The upper terrace has the sun court and the sanctuary cut into the cliff. Note: the temple copies the bowl of the cliff and faces east across the river towards Karnak.</desc>
<text x="40.0" y="70.0" font-family="Fraunces, Georgia, serif" font-size="44" font-weight="600" fill="#1F2A37" text-anchor="start">Hatshepsut's temple: three terraces</text>
<text x="40.0" y="114.0" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="28" font-weight="400" fill="#8A8F98" text-anchor="start">Front view, looking west at the cliff. Not to scale.</text>
