<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1362" role="img" aria-labelledby="dia-karnak-route-t dia-karnak-route-d">
<title id="dia-karnak-route-t">Karnak: the main axis, west to east</title><desc id="dia-karnak-route-d">East-west schematic of the main axis of the Amun precinct at Karnak, north up, the Nile on the west. Numbered stops in the usual order: 1 avenue of ram-headed sphinxes, 2 First Pylon, 3 Great Court with the Kiosk of Taharqa in the middle, the Temple of Seti II to the north and the Temple of Ramesses III to the south, 4 Second Pylon, 5 Great Hypostyle Hall with 134 columns, 6 obelisks between the Fourth and Fifth Pylons including Hatshepsut's, 7 the Sacred Lake and giant scarab south of the axis, 8 the Festival Hall of Thutmose III at the east end. The axis leads from the Nile inland; the walking route is up to the guide.</desc>
<text x="40.0" y="70.0" font-family="Fraunces, Georgia, serif" font-size="44" font-weight="600" fill="#1F2A37" text-anchor="start">Karnak: the main axis, west to east</text>
<text x="40.0" y="114.0" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="28" font-weight="400" fill="#8A8F98" text-anchor="start">Schematic, not to scale. North is up.</text>
